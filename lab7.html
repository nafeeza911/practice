
<!DOCTYPE html>
<html>
<head>
    <title>Simple Calendar</title>

    <style>
        body {
            background-color: pink;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        table {
            border-collapse: collapse;
            margin: 10px auto;
            background-color: white;
        }

        th, td {
            padding: 8px;
            text-align: center;
            border: 1px solid black;
            width: 35px;
        }

        th {
            background-color: lightblue;
        }

        h2 {
            color: darkblue;
        }

        input {
            padding: 8px;
            margin: 10px;
        }

        button {
            padding: 8px 15px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        #calendar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            #calendar {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            #calendar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h2>Generate Calendar for a Year</h2>

    <p>Enter the year:</p>

    <input type="number" id="yearInput" placeholder="Enter year">

    <button onclick="generateCalendar()">
        Generate Calendar
    </button>

    <div id="calendar"></div>

    <script>

        function generateCalendar() {

            const year = document.getElementById("yearInput").value;

            if (year === "" || isNaN(year) || year < 1000 || year > 9999) {
                alert("Please enter a valid year between 1000 and 9999");
                return;
            }

            const calendarDiv = document.getElementById("calendar");

            calendarDiv.innerHTML = "";

            const months = [
                "January",
                "February",
                "March",
                "April",
                "May",
                "June",
                "July",
                "August",
                "September",
                "October",
                "November",
                "December"
            ];

            for (let month = 0; month < 12; month++) {

                let monthTable =
                    '<table>' +
                    '<tr><th colspan="7"><strong>' +
                    months[month] + " " + year +
                    '</strong></th></tr>';

                monthTable +=
                    '<tr>' +
                    '<th>Sun</th>' +
                    '<th>Mon</th>' +
                    '<th>Tue</th>' +
                    '<th>Wed</th>' +
                    '<th>Thu</th>' +
                    '<th>Fri</th>' +
                    '<th>Sat</th>' +
                    '</tr>';

                const firstDay =
                    new Date(Number(year), month, 1).getDay();

                const daysInMonth =
                    new Date(Number(year), month + 1, 0).getDate();

                let dayCounter = 1;

                for (let i = 0; i < 6; i++) {

                    let row = "<tr>";

                    for (let j = 0; j < 7; j++) {

                        if (i === 0 && j < firstDay) {

                            row += "<td></td>";

                        } else if (dayCounter <= daysInMonth) {

                            row += "<td>" + dayCounter + "</td>";

                            dayCounter++;

                        } else {

                            row += "<td></td>";

                        }
                    }

                    row += "</tr>";

                    monthTable += row;

                    if (dayCounter > daysInMonth) {
                        break;
                    }
                }

                monthTable += "</table>";

                calendarDiv.innerHTML += monthTable;
            }
        }

    </script>

</body>
</html>
